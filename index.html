<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & DASAR --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.5;
            padding-bottom: 50px;
        }

        /* --- HEADER --- */
        header {
            background-color: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }

        header p {
            font-size: 13px;
            color: #64748b;
        }

        /* --- LAYOUT UTAMA --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        /* --- PANEL UMUM --- */
        .panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            flex: 1;
            min-width: 320px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 15px;
            margin-bottom: 20px;
            color: #1e293b;
        }

        /* --- FORM ADMIN --- */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            background-color: #f8fafc;
        }

        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #ffffff;
        }

        .file-input {
            border: 1px dashed #94a3b8;
            padding: 10px;
            background-color: #f8fafc;
            border-radius: 8px;
            width: 100%;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        /* --- KATALOG PEMBELI --- */
        .katalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
            font-size: 14px;
            border: 2px dashed #e2e8f0;
            border-radius: 8px;
            grid-column: 1 / -1; /* Mengambil ruang penuh */
        }

        .product-card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #f1f5f9;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-name {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 700;
            color: #16a34a;
            margin-bottom: 10px;
        }

        .product-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .product-video {
            width: 100%;
            border-radius: 6px;
            margin-bottom: 15px;
            background-color: #000;
            height: 150px;
        }

        .btn-buy {
            display: block;
            text-align: center;
            background-color: #10b981;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <header>
        <h1>GadgetStore Management System</h1>
        <p>Panel Admin & Katalog Interaktif</p>
    </header>

    <div class="container">
        
        <!-- PANEL ADMIN -->
        <div class="panel">
            <h2 class="panel-title">⚙️ Tambah Produk Baru (Admin)</h2>
            
            <form id="adminForm">
                <div class="form-group">
                    <label>Nama Produk</label>
                    <input type="text" id="prodName" class="form-control" placeholder="Masukkan nama..." required>
                </div>
                
                <div class="form-group">
                    <label>Harga Produk (Angka saja)</label>
                    <input type="number" id="prodPrice" class="form-control" placeholder="Contoh: 15000000" required>
                </div>
                
                <div class="form-group">
                    <label>Deskripsi Singkat</label>
                    <textarea id="prodDesc" class="form-control" rows="3" placeholder="Spesifikasi utama..." required></textarea>
                </div>

                <div class="form-group">
                    <label>📸 Foto Produk</label>
                    <input type="file" id="prodImg" class="file-input" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label>🎥 Video Demo Produk</label>
                    <input type="file" id="prodVid" class="file-input" accept="video/*" required>
                </div>

                <button type="submit" class="btn-submit">Tambahkan ke Katalog</button>
            </form>
        </div>

        <!-- PANEL PEMBELI -->
        <div class="panel">
            <h2 class="panel-title">🛍️ Katalog Produk (Pembeli)</h2>
            
            <div class="katalog-grid" id="katalogGrid">
                <!-- Tampilan awal kosong -->
                <div class="empty-state" id="emptyState">
                    Belum ada produk yang ditambahkan.<br>
                    Silakan upload produk melalui Panel Admin di sebelah.
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT UNTUK MEMBUAT UPLOAD BERFUNGSI -->
    <script>
        document.getElementById('adminForm').addEventListener('submit', function(event) {
            // Mencegah web melakukan reload saat tombol ditekan
            event.preventDefault();

            // Mengambil nilai dari form
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const desc = document.getElementById('prodDesc').value;
            
            // Mengambil file gambar dan video yang diupload
            const imgFile = document.getElementById('prodImg').files[0];
            const vidFile = document.getElementById('prodVid').files[0];

            // Membuat URL sementara agar file bisa ditampilkan di browser
            const imgURL = URL.createObjectURL(imgFile);
            const vidURL = URL.createObjectURL(vidFile);

            // Format harga ke dalam Rupiah
            const formattedPrice = new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(price);

            // Menghilangkan pesan "Belum ada produk"
            const emptyState = document.getElementById('emptyState');
            if (emptyState) {
                emptyState.style.display = 'none';
            }

            // Membuat elemen HTML untuk produk baru
            const productCard = document.createElement('div');
            productCard.className = 'product-card';
            
            productCard.innerHTML = `
                <img src="${imgURL}" alt="${name}" class="product-img">
                <div class="product-info">
                    <h3 class="product-name">${name}</h3>
                    <p class="product-price">${formattedPrice}</p>
                    <p class="product-desc">${desc}</p>
                    
                    <video controls class="product-video">
                        <source src="${vidURL}" type="${vidFile.type}">
                        Browser tidak mendukung tag video.
                    </video>
                    
                    <a href="#checkout" class="btn-buy" onclick="alert('Lanjut ke pembayaran!')">Beli Sekarang</a>
                </div>
            `;

            // Menambahkan produk baru ke dalam katalog
            document.getElementById('katalogGrid').appendChild(productCard);

            // Membersihkan form setelah berhasil
            document.getElementById('adminForm').reset();
            alert('Produk berhasil ditambahkan ke Katalog!');
        });
    </script>
</body>
</html>
