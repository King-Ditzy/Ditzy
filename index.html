<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - E-Commerce Kita</title>
    <style>
        /* Base Reset & Typography */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f3f4f6; /* Warna abu-abu terang modern */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container & Card Style */
        .login-wrapper {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2.5rem 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h2 {
            color: #111827;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #6b7280;
            font-size: 0.875rem;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #111827;
            transition: border-color 0.15s ease-in-out;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Button Style */
        .submit-btn {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
            margin-top: 0.5rem;
        }

        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        .submit-btn:active {
            background-color: #1e40af;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Selamat Datang</h2>
                <p>Silakan masuk ke akun Anda</p>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Masukkan password" required>
                </div>
                
                <button type="submit" class="submit-btn">Masuk</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            // Mencegah halaman reload saat form disubmit
            event.preventDefault();

            // Mengambil nilai dari input form
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;

            // Logika validasi login
            if (usernameInput === 'admin' && passwordInput === 'admin1234') {
                // Skenario 1: Jika yang login adalah Admin
                alert('Login Berhasil! Selamat datang, Admin.');
                
                // Di dunia nyata, Anda bisa redirect ke dashboard admin seperti ini:
                // window.location.href = '/admin-dashboard.html';
                
            } else if (usernameInput !== '' && passwordInput !== '') {
                // Skenario 2: Jika yang login adalah User (bebas isi apa saja)
                alert('Login Berhasil! Selamat berbelanja, ' + usernameInput + '.');
                
                // Di dunia nyata, Anda bisa redirect ke halaman utama/home seperti ini:
                // window.location.href = '/home.html';
                
            } else {
                // Jika tidak sengaja terlewat required atribut HTML
                alert('Harap isi username dan password!');
            }
        });
    </script>

</body>
</html>
