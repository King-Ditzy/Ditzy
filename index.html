<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Sistem Terpadu</title>
    <!-- Font Inter yang Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- RESET & GLOBAL --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #334155;
            line-height: 1.6;
        }

        /* --- NAVBAR --- */
        #navbar {
            display: none; 
            background-color: #ffffff;
            padding: 12px 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap; 
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .nav-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .nav-brand { font-size: 18px; font-weight: 800; color: #0f172a; }
        .nav-role-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }
        .btn-logout {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.3s;
        }
        .btn-logout:hover { background-color: #dc2626; }

        /* --- CONTAINER UTAMA --- */
        .container { max-width: 900px; margin: 25px auto; padding: 0 15px; }

        /* --- HALAMAN LOGIN --- */
        #view-login { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; }
        .login-box {
            background: white; padding: 30px 20px; border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 450px;
        }
        .login-box h1 { font-weight: 800; font-size: 22px; margin-bottom: 5px; }
        .login-box p { color: #64748b; font-size: 14px; margin-bottom: 25px; }
        
        .role-cards { display: flex; gap: 15px; }
        @media (max-width: 400px) { .role-cards { flex-direction: column; } }
        
        .role-card {
            flex: 1; border: 2px solid #e2e8f0; border-radius: 16px;
            padding: 20px 10px; cursor: pointer; transition: 0.3s;
        }
        .role-card.admin { background-color: #f8fafc; }
        .role-card.user { background-color: #f8fafc; }
        .role-card.admin:hover, .role-card.admin:active { border-color: #3b82f6; background-color: #eff6ff; }
        .role-card.user:hover, .role-card.user:active { border-color: #10b981; background-color: #f0fdf4; }
        .role-icon { font-size: 35px; margin-bottom: 5px; }
        .role-title { font-weight: 700; font-size: 15px; color: #1e293b; }

        /* --- HALAMAN ADMIN --- */
        .panel { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .panel h2 { font-size: 18px; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; color: #0f172a;}
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #475569;}
        .form-control, .file-input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px;
        }
        .form-control:focus { outline: none; border-color: #3b82f6; }
        .file-input { background-color: #f8fafc; cursor: pointer; color: #64748b; }
        
        .btn-submit {
            width: 100%; background: #2563eb; color: white; padding: 14px;
            border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 15px;
        }

        /* --- HALAMAN PEMBELI --- */
        .katalog-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
        }
        .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; border: 2px dashed #cbd5e1; border-radius: 12px; grid-column: 1 / -1; font-size: 14px;}
        
        .product-card { border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; background: white; display: flex; flex-direction: column; }
        .product-img { width: 100%; height: 200px; object-fit: cover; background-color: #e2e8f0; display: block; }
        
        .product-info { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-name { font-weight: 700; font-size: 18px; margin-bottom: 2px; color: #0f172a; }
        .product-price { font-weight: 800; color: #16a34a; font-size: 18px; margin-bottom: 12px; }
        
        .product-desc { 
            font-size: 13px; color: #64748b; margin-bottom: 15px; flex-grow: 1; 
            line-height: 1.5; word-wrap: break-word; 
        }
        
        .product-video { width: 100%; height: 160px; background: black; border-radius: 8px; margin-bottom: 15px; }
        .btn-buy { display: block; text-align: center; background: #10b981; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 14px; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav id="navbar" style="display: none;">
        <div class="nav-left">
            <div class="nav-brand">GadgetStore</div>
            <div class="nav-role-badge" id="navRoleText">Role</div>
        </div>
        <button class="btn-logout" onclick="logout()">🔄 Ganti Peran</button>
    </nav>

    <div class="container">
        
        <!-- ==================== VIEW 1: LOGIN ==================== -->
        <div id="view-login">
            <div class="login-box">
                <h1>GadgetStore Pro</h1>
                <p>Pilih peran Anda untuk masuk</p>
                <div class="role-cards">
                    <div class="role-card admin" onclick="login('admin')">
                        <div class="role-icon">👨‍💻</div>
                        <div class="role-title">Admin</div>
                    </div>
                    <div class="role-card user" onclick="login('user')">
                        <div class="role-icon">🛍️</div>
                        <div class="role-title">Pembeli</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== VIEW 2: ADMIN ==================== -->
        <div id="view-admin" style="display: none;">
            <div class="panel">
                <h2>⚙️ Tambah Produk Baru</h2>
                <form id="adminForm">
                    <div class="form-group">
                        <label>Nama Produk</label>
                        <input type="text" id="prodName" class="form-control" required placeholder="Cth: iPhone 15 Pro">
                    </div>
                    <div class="form-group">
                        <label>Harga Produk (Tanpa Titik)</label>
                        <input type="number" id="prodPrice" class="form-control" required placeholder="Cth: 20000000">
                    </div>
                    <div class="form-group">
                        <label>Spesifikasi / Deskripsi</label>
                        <textarea id="prodDesc" class="form-control" rows="3" required placeholder="Detail produk..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>📸 Upload Foto Produk</label>
                        <input type="file" id="prodImg" class="file-input" accept="image/png, image/jpeg, image/jpg, image/webp" required>
                    </div>
                    <div class="form-group">
                        <label>🎥 Upload Video Demo</label>
                        <input type="file" id="prodVid" class="file-input" accept="video/mp4, video/webm, video/ogg" required>
                    </div>
                    
                    <button type="submit" class="btn-submit">Simpan & Publikasikan</button>
                </form>
            </div>
        </div>

        <!-- ==================== VIEW 3: PEMBELI ==================== -->
        <div id="view-user" style="display: none;">
            <div class="panel">
                <h2>🛍️ Katalog Gadget Terbaru</h2>
                <div class="katalog-grid" id="katalogGrid">
                    <!-- Produk muncul di sini -->
                </div>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        let dataProduk = [];

        function showView(viewId) {
            document.getElementById('view-login').style.display = 'none';
            document.getElementById('view-admin').style.display = 'none';
            document.getElementById('view-user').style.display = 'none';
            document.getElementById(viewId).style.display = 'block';
        }

        // --- FITUR LOGIN PASSWORD ---
        function login(role) {
            const badge = document.getElementById('navRoleText');
            
            if (role === 'admin') {
                // Munculkan pop-up minta password
                const password = prompt("Masukkan Password Admin:");
                
                // Cek apakah password benar
                if (password === "admin123") {
                    document.getElementById('navbar').style.display = 'flex';
                    badge.innerText = "Mode: Admin";
                    badge.style.backgroundColor = "#dbeafe";
                    badge.style.color = "#1e40af";
                    showView('view-admin');
                } else if (password !== null) { // Jika user tidak klik Cancel
                    alert("⚠️ Password salah! Anda tidak diizinkan masuk.");
                }
            } 
            else if (role === 'user') {
                // Pembeli tidak butuh password
                document.getElementById('navbar').style.display = 'flex';
                badge.innerText = "Mode: Pembeli";
                badge.style.backgroundColor = "#dcfce7";
                badge.style.color = "#166534";
                showView('view-user');
                renderKatalog();
            }
        }

        function logout() {
            document.getElementById('navbar').style.display = 'none';
            showView('view-login');
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('adminForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = this.querySelector('.btn-submit');
            submitBtn.innerText = "Memproses...";
            submitBtn.disabled = true;

            try {
                const name = document.getElementById('prodName').value;
                const price = document.getElementById('prodPrice').value;
                const desc = document.getElementById('prodDesc').value;
                
                const imgFile = document.getElementById('prodImg').files[0];
                const vidFile = document.getElementById('prodVid').files[0];

                const imgURL = await getBase64(imgFile);
                const vidURL = URL.createObjectURL(vidFile);

                dataProduk.push({
                    nama: name,
                    harga: price,
                    deskripsi: desc,
                    gambar: imgURL,
                    video: vidURL,
                    tipeVideo: vidFile.type
                });

                document.getElementById('adminForm').reset();
                alert('Berhasil! Produk sudah ditambahkan ke Katalog Pembeli.');
            } catch (error) {
                alert('Terjadi kesalahan saat mengunggah file. Pastikan format gambar benar (JPG/PNG).');
            } finally {
                submitBtn.innerText = "Simpan & Publikasikan";
                submitBtn.disabled = false;
            }
        });

        function renderKatalog() {
            const grid = document.getElementById('katalogGrid');
            grid.innerHTML = '';

            if (dataProduk.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        🛒 Katalog masih kosong.<br>
                        Silakan Ganti Peran ke Admin untuk menambahkan produk.
                    </div>
                `;
                return;
            }

            dataProduk.forEach(function(produk) {
                const hargaRupiah = new Intl.NumberFormat('id-ID', {
                    style: 'currency', currency: 'IDR', minimumFractionDigits: 0
                }).format(produk.harga);

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${produk.gambar}" class="product-img" alt="Foto Produk">
                    <div class="product-info">
                        <div class="product-name">${produk.nama}</div>
                        <div class="product-price">${hargaRupiah}</div>
                        <div class="product-desc">${produk.deskripsi}</div>
                        
                        <video controls class="product-video">
                            <source src="${produk.video}" type="${produk.tipeVideo}">
                            Browser HP kamu tidak mendukung pemutaran video.
                        </video>
                        
                        <a href="#" class="btn-buy" onclick="alert('Mengarahkan ke pembayaran...')">Beli Sekarang</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
